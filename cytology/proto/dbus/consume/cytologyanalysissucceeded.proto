syntax = "proto3";

package med_ml.cytology.analysis_succeeded.v1;

option go_package = "internal/generated/dbus/consume/cytologyanalysissucceeded";

message AnalysisSucceeded {
  // UUID из AnalysisRequested.
  string analysis_id = 100;

  Result result = 200;
}

message Result {
  // Найденные клетки и скопления.
  repeated Feature features = 100;

  // Автоматическая оценка по правилам Bethesda/LNP.
  Conclusion conclusion = 200;
}

message Feature {
  Geometry geometry = 100;
  Properties properties = 200;
}

message Geometry {
  oneof geometry_type {
    Point point = 100;
    Polygon polygon = 200;
  }
}

message Point {
  double x = 100;
  double y = 200;
}

message Polygon {
  // Первое кольцо — внешний контур.
  // Последующие кольца, если появятся, — внутренние контуры.
  repeated Ring rings = 100;
}

message Ring {
  repeated Point points = 100;
}

enum SegType {
  SEG_TYPE_UNSPECIFIED = 0;
  NIL = 1;
  CNO = 2;
  CGE = 3;
  C2N = 4;
  CPS = 5;
  CFC = 6;
  CLY = 7;
  PFC = 8;
  NIR = 9;
  SOS = 10;
  SDS = 11;
  SMS = 12;
  STS = 13;
  SPS = 14;
  SCL = 15;
  NIM = 16;
}

message Properties {
  Classification classification = 100;

  // Код типа сегмента.
  SegType seg_type = 200;
}

message Classification {
  string name = 100;
  Color color = 200;
}

message Color {
  int32 r = 100;
  int32 g = 200;
  int32 b = 300;
}

message Conclusion {
  int32 category = 100;
  string short_label = 200;
  string title_ru = 300;
  string step = 400;
  repeated string rationale = 500;
  repeated string notes = 600;
  optional string comment_ru = 700;
  optional string algorithm = 800;
  Counts counts = 900;
}

message Counts {
  int64 cluster_total = 100;
  int64 thyroid_epithelial_total = 200;
  repeated ClassCount by_class = 300;
  int64 unclassified_clusters = 400;
  repeated ClassCount unknown_labels = 500;

  // Присутствуют только в результате исследования LNP.
  optional int64 parafollicular_cells = 600;
  optional int64 oncocytes = 700;
}

message ClassCount {
  string name = 100;
  int64 count = 200;
}
