syntax = "proto3";

package med_ml.cytology.analysis_succeeded.v1;

option go_package = "internal/generated/dbus/consume/cytologyanalysissucceeded";

message AnalysisSucceeded {
  string analysis_id = 100;
  Result result = 200;
}

message Result {
  repeated Feature features = 100;
  Conclusion conclusion = 200;
}

message Feature {
  Geometry geometry = 100;
  Properties properties = 200;
}

message Geometry {
  oneof geometry_type {
    Point point = 100;
    Polygon polygon = 200;
  }
}

message Point {
  double x = 100;
  double y = 200;
}

message Polygon {
  repeated Ring rings = 100;
}

message Ring {
  repeated Point points = 100;
}

message Properties {
  Classification classification = 100;
}

message Classification {
  string name = 100;
  Color color = 200;
}

message Color {
  int32 r = 100;
  int32 g = 200;
  int32 b = 300;
}

message Conclusion {
  int32 category = 100;
  string short_label = 200;
  string title_ru = 300;
  string step = 400;
  repeated string rationale = 500;
  repeated string notes = 600;
  optional string comment_ru = 700;
  optional string algorithm = 800;
  Counts counts = 900;
}

message Counts {
  int64 cluster_total = 100;
  int64 thyroid_epithelial_total = 200;
  repeated ClassCount by_class = 300;
  int64 unclassified_clusters = 400;
  repeated ClassCount unknown_labels = 500;
  optional int64 parafollicular_cells = 600;
  optional int64 oncocytes = 700;
}

message ClassCount {
  string name = 100;
  int64 count = 200;
}
