version: "3"

dotenv: [".env.example"]

tasks:
  bin-deps:
    cmds:
      - GOBIN=$(pwd)/bin go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
      - GOBIN=$(pwd)/bin go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest

  test-tools:
    cmds:
      - mkdir -p bin reports
      - GOBIN=$(pwd)/bin go install gotest.tools/gotestsum@latest
      - GOBIN=$(pwd)/bin go install github.com/DarkDrim/go-test-report@latest
    status:
      - test -x bin/gotestsum
      - test -x bin/go-test-report

  codegen:
    vars:
      proto_files:
        sh: find proto -type f -name "*.proto" | xargs echo

    cmds:
      - rm -rf internal/generated
      - for: { var: proto_files }
        cmd: >
          protoc
          --plugin=protoc-gen-go=$(pwd)/bin/protoc-gen-go
          --plugin=protoc-gen-go-grpc=$(pwd)/bin/protoc-gen-go-grpc
          --experimental_allow_proto3_optional
          --go_out . --go-grpc_out .
          {{.ITEM}}

  style:
    cmds:
      - go fmt ./...
      - go tool goimports -w .
      - go tool gofumpt -l -w .

  build:
    cmds:
      - task: style
      - go build -v -o bin/service cmd/service/main.go

  run:
    cmds:
      - task: build
      - ./bin/service

  migration-up:
    cmds:
      - go tool goose -dir db/migrations up

  migration-down:
    cmds:
      - go tool goose -dir db/migrations down

  test:
    deps: [test-tools]
    cmds:
      - bin/gotestsum --format testname --format-hide-empty-pkg -- ./internal/... -count=1

  test:report:
    deps: [test-tools]
    cmds:
      - mkdir -p reports
      - |
        set +e
        bin/gotestsum --format testname --format-hide-empty-pkg \
          --jsonfile reports/unit.json \
          --raw-command -- go test -count=1 -json ./internal/...
        echo $? > reports/.test-exit
        set -e
      - |
        bin/go-test-report \
          -i reports/unit.json \
          -o reports/unit-report.html \
          -t "Cytology — unit-тесты"
      - go test ./internal/... -count=1 -coverprofile=reports/coverage.out
      - go tool cover -html=reports/coverage.out -o reports/coverage.html
      - task: report:export
        vars:
          SOURCE: unit-report.html
          TARGET: unit-report.pdf
          FORMAT: pdf
      - task: report:export
        vars:
          SOURCE: unit-report.html
          TARGET: unit-report.png
          FORMAT: png
      - |
        echo ""
        echo "Готово:"
        echo "  reports/unit-report.html  — интерактивный отчёт"
        echo "  reports/unit-report.pdf   — PDF для вставки в отчёт"
        echo "  reports/unit-report.png   — картинка (если PDF недоступен)"
        echo "  reports/coverage.html     — покрытие кода"
      - exit $(cat reports/.test-exit)

  report:export:
    internal: true
    vars:
      SOURCE: '{{.SOURCE | default "e2e-report.html"}}'
      TARGET: '{{.TARGET | default "e2e-report.pdf"}}'
      FORMAT: '{{.FORMAT | default "pdf"}}'
    cmds:
      - |
        HTML="reports/{{.SOURCE}}"
        OUT="reports/{{.TARGET}}"
        FORMAT="{{.FORMAT}}"
        if [ ! -f "$HTML" ]; then
          echo "skip $FORMAT: $HTML not found"
          exit 0
        fi
        URL="file://$(cd reports && pwd)/{{.SOURCE}}"
        CHROME=""
        for c in google-chrome chromium-browser chromium \
          "/mnt/c/Program Files/Google/Chrome/Application/chrome.exe" \
          "/mnt/c/Program Files (x86)/Google/Chrome/Application/chrome.exe"; do
          if command -v "$c" >/dev/null 2>&1; then
            CHROME="$c"
            break
          fi
          if [ -x "$c" ]; then
            CHROME="$c"
            break
          fi
        done
        if [ -z "$CHROME" ]; then
          if [ "$FORMAT" = "pdf" ]; then
            echo "Chrome/Chromium не найден — PDF не создан."
            echo "Открой reports/{{.SOURCE}} → Печать → Сохранить как PDF."
          else
            echo "Chrome/Chromium не найден — PNG не создан."
            echo "Открой reports/{{.SOURCE}} и сделай скриншот (Win+Shift+S)."
          fi
          exit 0
        fi
        if [ "$FORMAT" = "pdf" ]; then
          "$CHROME" --headless=new --disable-gpu --no-pdf-header-footer \
            --print-to-pdf="$OUT" "$URL"
          echo "PDF: $OUT"
        else
          "$CHROME" --headless=new --disable-gpu --window-size=1400,900 \
            --screenshot="$OUT" "$URL"
          echo "PNG: $OUT"
        fi

  test:pdf:
    deps: [test-tools]
    cmds:
      - task: test:report

  e2e:pdf:
    deps: [test-tools]
    cmds:
      - task: e2e:report

  e2e:
    deps: [test-tools]
    cmds:
      - bin/gotestsum --format testname --format-hide-empty-pkg -- -tags=e2e -count=1 ./tests/e2e/...

  e2e:report:
    deps: [test-tools]
    cmds:
      - mkdir -p reports
      - |
        set +e
        bin/gotestsum --format testname --format-hide-empty-pkg \
          --jsonfile reports/e2e.json \
          --raw-command -- go test -tags=e2e -count=1 -json ./tests/e2e/...
        echo $? > reports/.test-exit
        set -e
      - |
        bin/go-test-report \
          -i reports/e2e.json \
          -o reports/e2e-report.html \
          -t "Cytology — e2e (${APP_URL:-APP_URL не задан})"
      - task: report:export
        vars:
          SOURCE: e2e-report.html
          TARGET: e2e-report.pdf
          FORMAT: pdf
      - task: report:export
        vars:
          SOURCE: e2e-report.html
          TARGET: e2e-report.png
          FORMAT: png
      - |
        echo ""
        echo "Готово:"
        echo "  reports/e2e-report.html  — интерактивный отчёт"
        echo "  reports/e2e-report.pdf   — PDF для вставки в отчёт"
        echo "  reports/e2e-report.png   — картинка (если PDF недоступен)"
      - exit $(cat reports/.test-exit)
